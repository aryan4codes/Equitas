# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: equitas-api
    runtime: python
    pythonVersion: "3.13"
    plan: starter
    region: oregon
    healthCheckPath: /health
    # Install uv, then use it to install all project deps from pyproject.toml
    buildCommand: |
      pip install uv &&
      uv pip install --system -e .
    # gunicorn with uvicorn workers — production-grade ASGI serving
    startCommand: python -m gunicorn backend_api.main:app --workers 1 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120 --log-level info
    envVars:
      - key: MONGODB_URL
        sync: false
      - key: MONGODB_DATABASE
        value: equitas
      - key: OPENAI_API_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: EQUITAS_SLIM
        value: "true"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: TOKENIZERS_PARALLELISM
        value: "false"
